# ~/.config/ctxswitch/config.toml  (or $CTXSWITCH_CONFIG)

[hub]
url = "http://hub.local:7433"     # where collectors push and clients read
token = "change-me"                   # shared bearer token; same value in the hub's config
# hub-side only:
bind = "0.0.0.0"
port = 7433
# db_path = "/data/hub.db"

[collector]
host_id = "laptop"                    # stable short name for this machine (default: hostname)
claude_roots = ["~/.claude/projects"]
claude_sessions_dir = "~/.claude/sessions"
pi_roots = ["~/.pi/agent/sessions"]
# claude_win_roots = ["/mnt/c/Users/<you>/.claude/projects"]   # laptop WSL: Windows-native Claude, read-only
backfill_days = 30
accept_messages = true                # deliver `m` / `ctx send` messages into this host's live sessions
max_text_chars = 4000

# Hub only: the tracker LLM (recaps + ledger), an OpenAI-compatible /chat/completions endpoint with json_schema
# response_format. The hub uses the seat with the lowest priority; calls run one at a time. Thinking must be off on
# Qwen seats (see spikes/SPIKES.md). No config file (the docker hub): CTXSWITCH_SEAT_URL / _MODEL / _API_KEY.
[[seats]]
name = "text"
url = "http://llm.local:4000/v1"
api_key = "local"
model = "saint-local-text"
concurrency = 1
priority = 10
disable_thinking = true

# Ways to start Claude Code (client + collector). `c` on the board uses the first unless you type "name: directory";
# Enter resumes a session under the profile its transcript lives in. Each config_dir's projects/ and sessions/ are
# watched too, and `ctx install --claude` puts the hooks in each one's settings.json. Omit for plain `claude`.
# `x` (or `ctx move`) moves an ended session to the other profile and resumes it with that profile's `model`.
# A host with one account still names it (just `name = "max"`, say) so boards everywhere label its sessions.
# [[claude_profiles]]
# name = "bedrock"                      # the corporate account: whatever `claude` does from your shell
# model = "opus"                        # --model for new sessions and for a session moved here
# [[claude_profiles]]
# name = "max"                          # a personal Max subscription in its own config directory
# command = ["claude"]                  # argv; a wrapper script works, a shell alias doesn't
# config_dir = "~/.claude-max"          # CLAUDE_CONFIG_DIR
# unset = ["CLAUDE_CODE_USE_BEDROCK", "AWS_PROFILE"]
# env = {}
# model = "claude-fable-5-1"

# How this machine reaches other hosts to resume their sessions (client side). Unlisted hosts use the host id as
# the ssh destination (an ~/.ssh/config alias); "" = not reachable from here.
# [ssh]
# devbox = "me@devbox.lan"
# laptop = ""                          # inbound blocked: show the command to run there instead

notify = true                         # tmux pop-up on this machine for each new question or dialog
notify_idle = false                   # ... and when an agent finishes its turn
notify_style = "popup"                # "popup": a box over the panes until you press a key; "status": the status line
