<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470">
<defs><marker id="a8a8a8a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker><marker id="s8a8a8a" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker><marker id="a98e024" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#98e024"/></marker><marker id="s98e024" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#98e024"/></marker><marker id="af92672" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f92672"/></marker><marker id="sf92672" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f92672"/></marker><marker id="affa62b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffa62b"/></marker><marker id="sffa62b" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffa62b"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/></filter><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#181818"/><stop offset="1" stop-color="#121212"/></linearGradient></defs><rect width="1180" height="470" rx="16" fill="url(#bg)"/>
<text x="40" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#e0e0e0" text-anchor="start">A message&#x27;s life</text>
<text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8a8a8a" text-anchor="start">m or ctx send types it into the session as a new prompt; the board follows it to the reply</text>
<rect x="40" y="112" width="240" height="168" rx="14" fill="#1e1e1e" stroke="#ffa62b" stroke-width="1.6" filter="url(#shadow)"/>
<text x="66" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="30" font-weight="700" fill="#ffa62b" text-anchor="start">…</text>
<text x="104" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffa62b" text-anchor="start">queued</text>
<text x="62" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b8b8b8" text-anchor="start">on the hub, until the session&#x27;s</text>
<text x="62" y="219" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b8b8b8" text-anchor="start">host picks it up (now if it&#x27;s live,</text>
<text x="62" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b8b8b8" text-anchor="start">else when it next runs)</text>
<path d="M284,196 L316,196" fill="none" stroke="#ffa62b" stroke-width="2.2" marker-end="url(#affa62b)"/>
<rect x="320" y="112" width="240" height="168" rx="14" fill="#1e1e1e" stroke="#ffa62b" stroke-width="1.6" filter="url(#shadow)"/>
<text x="346" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="30" font-weight="700" fill="#ffa62b" text-anchor="start">→</text>
<text x="384" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffa62b" text-anchor="start">sent</text>
<text x="342" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b8b8b8" text-anchor="start">the collector wrote it into the</text>
<text x="342" y="219" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b8b8b8" text-anchor="start">session: Claude&#x27;s inbox socket,</text>
<text x="342" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b8b8b8" text-anchor="start">or pi&#x27;s extension</text>
<path d="M564,196 L596,196" fill="none" stroke="#ffa62b" stroke-width="2.2" marker-end="url(#affa62b)"/>
<rect x="600" y="112" width="240" height="168" rx="14" fill="#1e1e1e" stroke="#98e024" stroke-width="1.6" filter="url(#shadow)"/>
<text x="626" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="30" font-weight="700" fill="#98e024" text-anchor="start">✓</text>
<text x="664" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#98e024" text-anchor="start">delivered</text>
<text x="622" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b8b8b8" text-anchor="start">it&#x27;s in the transcript: the</text>
<text x="622" y="219" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b8b8b8" text-anchor="start">agent is working on it</text>
<text x="622" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b8b8b8" text-anchor="start">(exchange #12)</text>
<path d="M844,196 L876,196" fill="none" stroke="#98e024" stroke-width="2.2" marker-end="url(#a98e024)"/>
<rect x="880" y="112" width="240" height="168" rx="14" fill="#1e1e1e" stroke="#98e024" stroke-width="1.6" filter="url(#shadow)"/>
<text x="906" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="30" font-weight="700" fill="#98e024" text-anchor="start">↩</text>
<text x="944" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#98e024" text-anchor="start">replied</text>
<text x="902" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b8b8b8" text-anchor="start">the exchange finished; the</text>
<text x="902" y="219" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b8b8b8" text-anchor="start">reply&#x27;s first lines show</text>
<text x="902" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b8b8b8" text-anchor="start">under MESSAGES</text>
<rect x="40" y="312" width="240" height="64" rx="12" fill="#262626" stroke="#8a8a8a" stroke-width="1.2" />
<text x="58" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" xml:space="preserve"><tspan fill="#8a8a8a" font-weight="700">– </tspan><tspan fill="#e0e0e0" font-weight="700">cancelled</tspan></text>
<text x="58" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8a8a8a" text-anchor="start">ctx send --cancel &lt;id&gt; while queued</text>
<path d="M160,284 L160,308" fill="none" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#a8a8a8a)"/>
<rect x="320" y="312" width="240" height="64" rx="12" fill="#262626" stroke="#f92672" stroke-width="1.2" />
<text x="338" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" xml:space="preserve"><tspan fill="#f92672" font-weight="700">✗ </tspan><tspan fill="#e0e0e0" font-weight="700">failed</tspan></text>
<text x="338" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8a8a8a" text-anchor="start">socket refused or gone: send again</text>
<path d="M440,284 L440,308" fill="none" stroke="#f92672" stroke-width="1.6" marker-end="url(#af92672)"/>
<rect x="600" y="312" width="540" height="64" rx="12" fill="#262626" stroke="#58d1eb" stroke-width="1.2" />
<text x="618" y="337" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#58d1eb" text-anchor="start">to a workstream (W, ctx send --work)</text>
<text x="618" y="359" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8a8a8a" text-anchor="start">waits unbound; the first session live on that repo + branch, any host, takes it</text>
<rect x="600" y="388" width="540" height="64" rx="12" fill="#262626" stroke="#d97757" stroke-width="1.2" />
<text x="618" y="413" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#d97757" text-anchor="start">from another agent (MCP send_message)</text>
<text x="618" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8a8a8a" text-anchor="start">headed with its session and host, never &quot;you&quot;; one in flight per pair, 20 an hour</text>
<rect x="40" y="388" width="520" height="64" rx="12" fill="#262626" stroke="#98e024" stroke-width="1.2" />
<text x="58" y="413" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#98e024" text-anchor="start">answering a question (a, ctx reply)</text>
<text x="58" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8a8a8a" text-anchor="start">the same path, linked to the question; the ledger keeps your words</text>
</svg>
