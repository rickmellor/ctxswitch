[project]
name = "ctxswitch"
version = "0.0.1"
description = "Live cross-machine operator memory for Claude Code and pi sessions"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "websockets>=13",
    "watchfiles>=0.24",
    "textual>=0.80",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-timeout>=2.3"]

[project.scripts]
ctx = "ctxswitch.client.cli:main"
ctx-collector = "ctxswitch.collector.main:main"
ctx-hub = "ctxswitch.hub.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctxswitch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
