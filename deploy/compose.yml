# hub host: docker compose -f deploy/compose.yml up -d --build   (run from the repo root)
services:
  ctxswitch-hub:
    build:
      context: ..
      dockerfile: deploy/hub.Dockerfile
    container_name: ctxswitch-hub
    restart: unless-stopped
    ports:
      - "7433:7433"
    volumes:
      - ctxswitch-data:/data
    environment:
      - CTXSWITCH_HUB_TOKEN=${CTXSWITCH_HUB_TOKEN:-}
      - CTXSWITCH_SEAT_URL=${CTXSWITCH_SEAT_URL:-}           # LLM seat for recaps, e.g. http://llm.local:4000/v1
    command: ["sh", "-c", "exec ctx-hub --bind 0.0.0.0 --port 7433 --db /data/hub.db --token \"$CTXSWITCH_HUB_TOKEN\""]
volumes:
  ctxswitch-data:
